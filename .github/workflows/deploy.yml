name: Deploy SkyPulse AU
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "13,28,43,58 * * * *"

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  # A newer code change cancels an obsolete push build. Scheduled source refreshes
  # must not interrupt code deployments once started.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch official public data
        run: python scripts/sync_feeds.py
      - name: Retrieve NSW Warning Feeds
        run: python scripts/sync_warnings.py
      - name: Restore Last Verified Forecast Snapshot
        uses: actions/cache/restore@v4
        with:
          path: data/weather-cessnock.json
          key: skypulse-forecast-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            skypulse-forecast-
      - name: Publish Free Cessnock Forecast Backup
        id: forecast
        run: python scripts/sync_forecast.py
      - name: Preserve Successfully Updated Forecast Snapshot
        if: steps.forecast.outputs.fresh_primary == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/weather-cessnock.json
          key: skypulse-forecast-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Stamp Release and Cache Version
        run: python scripts/stamp_build.py
      - name: Validate Dashboard and PWA
        run: |
          node --check assets/app.js
          node --check assets/tools.js
          node scripts/test_tools.cjs
          node --check sw.js
          node --check assets/push.js
          node --check assets/update.js
          node --check assets/forecast-compare.js
          node --check assets/forecast-trend.js
          node --check assets/source-health.js
          node --check assets/severe-centre.js
          node --check assets/quarter-hour.js
          node --check notifications/src/index.js
          node --check notifications/generate-vapid.mjs
          node notifications/test/smoke.mjs
          python scripts/validate_site.py
          python scripts/test_fire_geometry.py
      - name: Check Forecast API Fields
        if: github.event_name != 'schedule'
        continue-on-error: true
        run: python scripts/check_weather_api.py
      - name: Check Real Weather Provider Responses
        if: github.event_name != 'schedule'
        continue-on-error: true
        run: python scripts/diagnose_live_data.py
      - name: Install Browser for Responsive Layout Test
        if: github.event_name != 'schedule'
        run: |
          npm install --no-save --no-fund --no-audit playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check Mobile Layout at Six Widths
        if: github.event_name != 'schedule'
        run: |
          node scripts/check_mobile_layout.mjs
          node scripts/test_radar_studio.mjs
          node scripts/test_forecast_reliability.mjs
          node scripts/test_geo_fallback.mjs
          node scripts/test_systems_overhaul.mjs
          node scripts/test_severe_intelligence.mjs
          node scripts/test_forecast_trend.mjs
          node scripts/test_fire_areas.mjs
      - name: Check Real Browser Weather Values
        if: github.event_name != 'schedule'
        continue-on-error: true
        run: node scripts/test_live_data_browser.mjs
      - name: Clean Browser Test Dependencies
        if: github.event_name != 'schedule'
        run: rm -rf node_modules package-lock.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Wait for Pages Artifact Registration
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Artifact upload can complete before the Actions REST API lists it.
          for attempt in {1..24}; do
            if count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length'); then
              if [[ "$count" == "1" ]]; then
                echo "Pages artifact is registered and ready."
                exit 0
              fi
            fi
            echo "Waiting for Pages artifact registration ($attempt/24)."
            sleep 5
          done
          echo "::error::Pages artifact did not become visible within 120 seconds."
          exit 1
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
