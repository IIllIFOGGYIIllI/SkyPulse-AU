name: Deploy SkyPulse AU
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch official public data
        run: python scripts/sync_feeds.py
      - name: Retrieve NSW Warning Feeds
        run: python scripts/sync_warnings.py
      - name: Stamp Release and Cache Version
        run: python scripts/stamp_build.py
      - name: Validate Dashboard and PWA
        run: |
          node --check assets/app.js
          node --check sw.js
          node --check assets/push.js
          node --check assets/update.js
          node --check notifications/src/index.js
          node --check notifications/generate-vapid.mjs
          node notifications/test/smoke.mjs
          python scripts/validate_site.py
      - name: Check Forecast API Fields
        continue-on-error: true
        run: python scripts/check_weather_api.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
